[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-action-item-extractor"
version = "0.1.0"
description = "A transparent baseline and LLM system for extracting meeting action items."
requires-python = ">=3.9"

[project.scripts]
maie = "meeting_action_extractor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meeting_action_extractor = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
